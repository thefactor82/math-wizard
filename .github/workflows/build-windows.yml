name: Build Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release a cui allegare i pacchetti (es. v1.0.21). Vuoto = ultimo tag del repo.'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            py_arch: x64
            zip: MathWizard-windows.zip
          - arch: win32
            py_arch: x86
            zip: MathWizard-windows-32bit.zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determina il tag della release
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.tag }}" -ne "") {
            $RELEASE_TAG = "${{ github.event.inputs.tag }}"
          } elseif ("${{ github.event_name }}" -eq "release") {
            $RELEASE_TAG = "${{ github.event.release.tag_name }}"
          } else {
            $RELEASE_TAG = git describe --tags --abbrev=0 2>$null
            if (-not $RELEASE_TAG) { $RELEASE_TAG = "nessun-tag" }
          }
          Write-Host "RELEASE_TAG=$RELEASE_TAG"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$RELEASE_TAG"

      - name: Setup Python (${{ matrix.arch }})
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.py_arch }}

      - name: Verifica bitness di Python
        shell: pwsh
        run: |
          python -c "import struct,sys; print('python', sys.version.split()[0], 'bits', struct.calcsize('P')*8)"
          $bits = (python -c "import struct; print(struct.calcsize('P')*8)")
          $expected = if ("${{ matrix.arch }}" -eq "win32") { 32 } else { 64 }
          if ($bits -ne $expected) { Write-Error "Python non è $($expected)-bit: $bits"; exit 1 }
          Write-Host "Python $($bits)-bit OK"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.6.1 pyinstaller==6.15.0 pillow certifi

      - name: Genera icona exe (.ico)
        run: |
          python -c "from PIL import Image; img=Image.open('graphics/misc/icon.png').convert('RGBA'); img.save('MathWizard.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build exe con PyInstaller
        run: python -m PyInstaller --noconfirm --clean MathWizard.spec

      - name: Verifica architettura exe
        shell: pwsh
        run: |
          $path = (Resolve-Path "dist\MathWizard.exe").Path
          $fs = [System.IO.File]::OpenRead($path)
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Position = 0x3C
          $peOffset = $br.ReadInt32()
          $fs.Position = $peOffset + 4
          $machine = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          $expected = if ("${{ matrix.arch }}" -eq "win32") { 0x014c } else { 0x8664 }
          if ($machine -ne $expected) { Write-Error "architettura exe non attesa: 0x$($machine.ToString('X4')) (atteso 0x$($expected.ToString('X4')))"; exit 1 }
          Write-Host "exe OK: 0x$($machine.ToString('X4')) (${{ matrix.arch }})"

      - name: Verifica exe e dati incorporati
        shell: pwsh
        run: |
          $exe = Get-Item dist\MathWizard.exe -ErrorAction Stop
          if ($exe.Length -lt 1000000) { Write-Error "exe sospettosamente piccolo: $($exe.Length) bytes"; exit 1 }
          Write-Host "exe OK: $($exe.Length) bytes"
          $listing = (python -m PyInstaller.utils.cliutils.archive_viewer -l -b "dist\MathWizard.exe" 2>&1) -join "`n"
          foreach ($needle in @('data\story.json', 'data\levels.json', 'fonts\DynaPuff.ttf', 'music\background.mp3')) {
            if ($listing -notmatch [regex]::Escape($needle)) { Write-Error "dato mancante dall'exe: $needle"; exit 1 }
          }
          Write-Host "data/risorse incorporati OK"

      - name: Smoke test (SDL dummy, processo vivo dopo 8s)
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $p = Start-Process -FilePath "dist\MathWizard.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "CRASH: exit code $($p.ExitCode)"
            exit 1
          }
          Write-Host "ALIVE dopo 8s (PID $($p.Id))"
          Stop-Process -Id $p.Id -Force

      - name: Crea lo zip (exe autosufficiente)
        working-directory: dist
        shell: pwsh
        run: |
          tar -a -c -f "${{ matrix.zip }}" "MathWizard.exe"
          Get-Item "${{ matrix.zip }}" | Select-Object Name, Length

      - name: Verifica contenuto zip
        working-directory: dist
        shell: pwsh
        run: |
          $list = tar -tf "${{ matrix.zip }}"
          foreach ($needle in @('MathWizard.exe')) {
            if ($list -notcontains $needle) { Write-Error "zip senza $needle"; exit 1 }
          }
          Write-Host "zip OK (contiene exe autosufficiente)"

      - name: Allega il pacchetto alla release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/${{ matrix.zip }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}